name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux audio library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 python3-tk
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Check source and repository layout
        run: python -m unittest discover -s tests -v
      - name: Import application without opening GUI
        run: python -c "import asrr6; print(asrr6.SHENAVA_DIR)"
